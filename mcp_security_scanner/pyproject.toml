[project]
name = "mcpsecscan"
version = "0.1.0"
description = "Starter MCP security vulnerability and misconfiguration scanner"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0", "pydantic>=2.7.0", "typer>=0.12.0", "rich>=13.7.0", "pyyaml>=6.0.1", "openpyxl>=3.1.5"]

[project.scripts]
mcpsecscan = "mcpsecscan.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
